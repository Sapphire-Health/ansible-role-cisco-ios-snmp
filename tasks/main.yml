
 # ------------------------------------------------------------------------
    # NETBOX: GET SITE (ROLE) + SNMP LOCATION
    # ------------------------------------------------------------------------
    - name: Include netbox_getsite
      include_role:
        name: netbox_getsite
      # expects netbox_site_response registered inside role

    - name: Set SNMP location fact from NetBox custom field
      set_fact:
        SNMP_LOCATION: "{{ netbox_site_response.json.custom_fields.SNMP_LOCATION }}"
      when:
        - netbox_site_response is defined
        - netbox_site_response.json is defined
        - netbox_site_response.json | length > 0
        - netbox_site_response.json.custom_fields is defined
        - netbox_site_response.json.custom_fields.SNMP_LOCATION is defined
        - netbox_site_response.json.custom_fields.SNMP_LOCATION | length > 0

    # ------------------------------------------------------------------------
    # MANAGEMENT ACL: build/update via mgnt_acl role (NetBox-sourced)
    # ------------------------------------------------------------------------
    - name: Create/update management ACL
      ansible.builtin.include_role:
        name: mgnt_acl
      vars:
        mgnt_acl: "{{ ios_snmp.acl }}"

    # ------------------------------------------------------------------------
    # IOS-XE: SNMP LOCATION (FROM NETBOX)
    # ------------------------------------------------------------------------
    - name: Configure SNMP location
      cisco.ios.ios_config:
        lines:
          - "snmp-server location {{ SNMP_LOCATION }}"
        before:
          - "no snmp-server location"
        match: strict
        replace: block
      when: SNMP_LOCATION is defined and SNMP_LOCATION | length > 0
      ignore_errors: true

    # ------------------------------------------------------------------------
    # IOS-XE: SNMPv3 VIEWS
    # ------------------------------------------------------------------------
    - name: Configure SNMP views (RO/RW)
      cisco.ios.ios_config:
        lines:
          - "snmp-server view {{ item.value }} internet included"
        match: line
      loop: "{{ ios_snmp.views | dict2items }}"
      loop_control:
        label: "{{ item.key }} => {{ item.value }}"

    # ------------------------------------------------------------------------
    # IOS-XE: SNMPv3 GROUPS (RO + RW)
    #   RO group: read ro-view
    #   RW group: read ro-view + write rw-view
    # ------------------------------------------------------------------------
    - name: Configure SNMP groups (RO / RW)
      cisco.ios.ios_config:
        lines:
          - >-
            snmp-server group {{ ios_snmp.groups[item] }} v3 priv
            read {{ ios_snmp.views.ro }}
            {% if item == 'rw' %}write {{ ios_snmp.views.rw }}{% endif %}
            access {{ ios_snmp.acl.name }}
        match: strict
        replace: block
      loop:
        - ro
        - rw
      loop_control:
        label: "{{ item }}"

    - name: Configure SNMP group context (vlan- match prefix)
      cisco.ios.ios_config:
        lines:
          - "snmp-server group {{ ios_snmp.groups[item] }} v3 priv context {{ ios_snmp.group_context.prefix }} match prefix"
        match: strict
        replace: block
      loop:
        - ro
        - rw
      when:
        - ios_snmp.group_context is defined
        - ios_snmp.group_context.enabled | bool
        - ios_snmp.group_context.prefix is defined
        - ios_snmp.group_context.prefix | length > 0

    # ------------------------------------------------------------------------
    # SNMPv3 USERS + HOSTS (robust delete/recreate) + OPTIONAL CLEANUP
    # Uses:
    #   ios_snmp.users
    #   ios_snmp.groups
    #   ios_snmp.acl.name
    #   ios_snmp_cleanup (bool)
    # ------------------------------------------------------------------------

    - name: Get existing SNMPv3 user lines from running-config (for safe deletes)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^snmp-server user "
      register: snmp_users_raw


    - name: Build map of existing SNMPv3 user -> full config line (robust)
      set_fact:
        existing_snmp_user_lines: "{{ snmp_users_raw.stdout_lines[0] | default([]) }}"
        existing_snmp_user_map: >-
          {%- set d = {} -%}
          {%- for l in (snmp_users_raw.stdout_lines[0] | default([])) -%}
          {%- set parts = l.split() -%}
          {%- if parts | length > 2 and parts[0] == 'snmp-server' and parts[1] == 'user' -%}
          {%- set _ = d.update({ parts[2]: l }) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ d }}


    - name: Remove SNMPv3 users we intend to manage (delete exact existing line if present)
      cisco.ios.ios_config:
        lines:
          - "no {{ existing_snmp_user_map[item.username] }}"
        match: none
      loop: "{{ ios_snmp.users }}"
      loop_control:
        label: "{{ item.username }}"
      when:
        - existing_snmp_user_map is defined
        - item.username in existing_snmp_user_map
      ignore_errors: true

    - name: Configure SNMPv3 users from ios_snmp.users (create/update)
      cisco.ios.ios_config:
        lines:
          - >-
            snmp-server user {{ item.username }}
            {{ ios_snmp.groups[item.access] }}
            v3 auth {{ item.auth_proto }} {{ item.auth_pass }}
            priv {{ item.priv_proto }} {{ item.priv_bits }} {{ item.priv_pass }}
            access {{ ios_snmp.acl.name }}
        match: none
      loop: "{{ ios_snmp.users }}"
      loop_control:
        label: "{{ item.username }} ({{ item.access }})"

    - name: Get existing SNMP host lines from running-config (for cleanup/replace)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^snmp-server host "
      register: snmp_hosts_raw

    - name: Build list of desired SNMP host lines (from users with host defined)
      set_fact:
        desired_snmp_host_lines: >-
          {{
            ios_snmp.users
            | selectattr('host', 'defined')
            | selectattr('host', 'string')
            | map('regex_replace', '^(.*)$', '') | list
          }}
      vars:
        # (We build via Jinja below; this dummy var keeps ansible happy with the set_fact structure.)
        _dummy: ""

    - name: Build desired SNMP host lines (actual)
      set_fact:
        desired_snmp_host_lines: >-
          {%- set lines = [] -%}
          {%- for u in ios_snmp.users -%}
          {%- if u.host is defined and (u.host|string|length) > 0 -%}
          {%- set _ = lines.append('snmp-server host ' ~ (u.host|string) ~ ' version 3 priv ' ~ u.username) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ lines }}

    - name: Remove existing SNMP host lines for users we manage (so changes apply cleanly)
      cisco.ios.ios_config:
        lines: >-
          {{
            (snmp_hosts_raw.stdout_lines[0] | default([]))
            | select('regex_search', ' version 3 \\S+ (' ~ ((ios_snmp.users | map(attribute="username") | list) | join("|")) ~ ')\\b$')
            | map('regex_replace', '^(.*)$', 'no \\1')
            | list
          }}
        match: none
      when:
        - snmp_hosts_raw is defined
        - (snmp_hosts_raw.stdout_lines[0] | default([])) | length > 0
      ignore_errors: true

    - name: Configure SNMP hosts for users that define 'host'
      cisco.ios.ios_config:
        lines: "{{ desired_snmp_host_lines }}"
        match: none
      when: desired_snmp_host_lines | length > 0

    # ------------------------------------------------------------------------
    # CISCO ISE: sync SNMPv3 polling credentials for this device
    # Users flagged with `cisco_ise: true` in ios_snmp.users are the
    # credentials Cisco ISE should use to poll this device via SNMPv3.
    # ------------------------------------------------------------------------
    - name: Determine SNMPv3 user(s) designated for Cisco ISE
      set_fact:
        ise_snmp_users: "{{ ios_snmp.users | selectattr('cisco_ise', 'defined') | selectattr('cisco_ise') | list }}"

    - name: Skip message if no SNMPv3 user is flagged for Cisco ISE
      debug:
        msg: "No user in ios_snmp.users has cisco_ise: true - skipping Cisco ISE SNMP sync"
      when: ise_snmp_users | length == 0

    - name: Sync SNMPv3 credentials to Cisco ISE
      when: ise_snmp_users | length > 0
      block:
        - name: Set desired ISE SNMP user (first flagged user)
          set_fact:
            ise_snmp_user: "{{ ise_snmp_users | first }}"

        - name: Map SNMPv3 protocols to Cisco ISE values
          set_fact:
            ise_snmp_auth_protocol: "{{ ise_snmp_user.auth_proto | upper }}"
            ise_snmp_priv_protocol: >-
              {{
                ('AES' ~ (ise_snmp_user.priv_bits | default(128) | string))
                if (ise_snmp_user.priv_proto | lower) == 'aes'
                else (ise_snmp_user.priv_proto | upper)
              }}

        - name: Check if device exists in Cisco ISE by IP
          ansible.builtin.uri:
            url: "https://{{ ise_hostname }}:{{ ise_port }}/ers/config/networkdevice?filter=ipaddress.EQ.{{ ansible_host }}"
            method: GET
            url_username: "{{ ise_username }}"
            url_password: "{{ ise_password }}"
            force_basic_auth: yes
            validate_certs: "{{ ise_verify }}"
            headers:
              Accept: "application/json"
            status_code: 200
          register: ise_snmp_ip_check
          delegate_to: localhost
          connection: local

        - name: Set ISE device-found flag
          set_fact:
            ise_snmp_device_found: "{{ ise_snmp_ip_check.json.SearchResult.total | int > 0 }}"

        - name: Get full device record from Cisco ISE
          ansible.builtin.uri:
            url: "https://{{ ise_hostname }}:{{ ise_port }}/ers/config/networkdevice/{{ ise_snmp_ip_check.json.SearchResult.resources[0].id }}"
            method: GET
            url_username: "{{ ise_username }}"
            url_password: "{{ ise_password }}"
            force_basic_auth: yes
            validate_certs: "{{ ise_verify }}"
            headers:
              Accept: "application/json"
            status_code: 200
          register: ise_snmp_device_details
          delegate_to: localhost
          connection: local
          when: ise_snmp_device_found

        - name: Build updated SNMP settings for Cisco ISE
          set_fact:
            ise_snmp_settings: >-
              {{
                (ise_snmp_device_details.json.NetworkDevice.snmpsettings | default({}))
                | combine({
                    'version': 'THREE',
                    'username': ise_snmp_user.username,
                    'securityLevel': 'PRIV',
                    'authProtocol': ise_snmp_auth_protocol,
                    'authPassword': ise_snmp_user.auth_pass,
                    'privacyProtocol': ise_snmp_priv_protocol,
                    'privacyPassword': ise_snmp_user.priv_pass
                  })
              }}
          when: ise_snmp_device_found

        - name: Push updated SNMP settings to Cisco ISE
          ansible.builtin.uri:
            url: "https://{{ ise_hostname }}:{{ ise_port }}/ers/config/networkdevice/{{ ise_snmp_device_details.json.NetworkDevice.id }}"
            method: PUT
            url_username: "{{ ise_username }}"
            url_password: "{{ ise_password }}"
            force_basic_auth: yes
            validate_certs: "{{ ise_verify }}"
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              NetworkDevice: "{{ ise_snmp_device_details.json.NetworkDevice | combine({'snmpsettings': ise_snmp_settings}) }}"
            status_code: [200, 201]
          register: ise_snmp_put_result
          delegate_to: localhost
          connection: local
          ignore_errors: true
          when: ise_snmp_device_found

        - name: Log full ISE response for troubleshooting on failure
          ansible.builtin.copy:
            content: "{{ ise_snmp_put_result | to_nice_json }}"
            dest: "{{ playbook_dir }}/logs/ise_snmp_put_{{ inventory_hostname }}.json"
          delegate_to: localhost
          connection: local
          when:
            - ise_snmp_device_found
            - ise_snmp_put_result is failed

        - name: Fail if Cisco ISE SNMP update failed
          ansible.builtin.fail:
            msg: >-
              Failed to update SNMP settings in Cisco ISE for {{ inventory_hostname }}.
              Full response logged to {{ playbook_dir }}/logs/ise_snmp_put_{{ inventory_hostname }}.json
          when:
            - ise_snmp_device_found
            - ise_snmp_put_result is failed

        - name: Warn if device was not found in Cisco ISE by IP
          debug:
            msg: "{{ ansible_host }} not found in Cisco ISE (by IP) - skipped SNMP settings sync for user {{ ise_snmp_user.username }}"
          when: not ise_snmp_device_found

    # ------------------------------------------------------------------------
    # SNMPv2 COMMUNITY ACL RETROFIT (KEEP YOUR LOGIC, JUST SWAP ACL NAME)
    # ------------------------------------------------------------------------
    - name: Get SNMP community config lines
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^snmp-server community"
      register: snmp_config



    - name: Extract SNMP communities with RO/RW (no ACL)
      set_fact:
        snmp_communities: >-
          {{
            snmp_config.stdout_lines[0] | default([])
            | select('match', '^snmp-server community \\S+ (RO|RW)(\\s|$)')
            | map('regex_replace', '^snmp-server community (\\S+ (RO|RW)).*', '\\1')
            | list
          }}



    - name: Debug SNMP community list
      debug:
        var: snmp_communities

    - name: Apply updated SNMP community lines (add ACL) one at a time
      cisco.ios.ios_config:
        lines:
          - "snmp-server community {{ item }} {{ ios_snmp.acl.name }}"
        match: none
      loop: "{{ snmp_communities }}"
      when: snmp_communities is defined and snmp_communities | length > 0



###############################################################
#      snmp v3 user cleanup                                   #
#                                                             #   
###############################################################




    - name: Cleanup | Skip message if ios_snmp_cleanup is false
      debug:
        msg: "ios_snmp_cleanup is false - skipping SNMP cleanup"
      when: not (ios_snmp_cleanup | default(false) | bool)

    # ------------------------------------------------------------
    # Gather existing SNMP config lines (authoritative source: show run)
    # ------------------------------------------------------------
    - name: Cleanup | Gather existing SNMP user and host lines from running-config
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^snmp-server user "
          - "show running-config | include ^snmp-server host "
      register: snmp_cfg_raw
      when: ios_snmp_cleanup | default(false) | bool

    - name: Cleanup | Normalize existing lines into lists
      set_fact:
        existing_snmp_user_lines: "{{ snmp_cfg_raw.stdout_lines[0] | default([]) }}"
        existing_snmp_host_lines: "{{ snmp_cfg_raw.stdout_lines[1] | default([]) }}"
      when: ios_snmp_cleanup | default(false) | bool

    # ------------------------------------------------------------
    # Build desired/existing username lists
    # ------------------------------------------------------------
    - name: Cleanup | Build desired SNMP username list (from vars)
      set_fact:
        desired_snmp_usernames: "{{ ios_snmp.users | map(attribute='username') | list }}"
      when: ios_snmp_cleanup | default(false) | bool

    - name: Cleanup | Build existing SNMP username list (parse from config lines)
      set_fact:
        existing_snmp_usernames: >-
          {{
            existing_snmp_user_lines
            | map('regex_replace', '^snmp-server user\\s+(\\S+).*', '\\1')
            | list
            | unique
          }}
      when: ios_snmp_cleanup | default(false) | bool

    - name: Cleanup | Compute SNMP users to remove (usernames only)
      set_fact:
        snmp_users_to_remove: >-
          {{
            (existing_snmp_usernames | difference(desired_snmp_usernames))
            | difference(ios_snmp_protected_users | default(['admin']))
          }}
      when: ios_snmp_cleanup | default(false) | bool

    - name: Cleanup | DEBUG lists (sanity check)
      debug:
        msg:
          - "Desired SNMP users: {{ desired_snmp_usernames }}"
          - "Existing SNMP users: {{ existing_snmp_usernames }}"
          - "Protected users: {{ ios_snmp_protected_users | default(['admin']) }}"
          - "SNMP users to remove: {{ snmp_users_to_remove }}"
      when: ios_snmp_cleanup | default(false) | bool

    # ------------------------------------------------------------
    # Build exact NO commands from the running-config lines
    # 1) Remove host lines referencing removed users (first)
    # 2) Remove user lines for removed users (second)
    # ------------------------------------------------------------
    - name: Cleanup | Build removal commands (hosts first, then users)
      set_fact:
        snmp_host_remove_lines: >-
          {{
            existing_snmp_host_lines
            | select('search', '\\b(' ~ (snmp_users_to_remove | join('|')) ~ ')\\b')
            | map('regex_replace', '^(.*)$', 'no \\1')
            | list
          }}
        snmp_user_remove_lines: >-
          {{
            existing_snmp_user_lines
            | select('match', '^snmp-server user\\s+(' ~ (snmp_users_to_remove | join('|')) ~ ')\\b')
            | map('regex_replace', '^(.*)$', 'no \\1')
            | list
          }}
      when:
        - ios_snmp_cleanup | default(false) | bool
        - snmp_users_to_remove is defined
        - snmp_users_to_remove | length > 0

    - name: Cleanup | DEBUG removal commands
      debug:
        msg:
          - "Host removal lines: {{ snmp_host_remove_lines | default([]) }}"
          - "User removal lines: {{ snmp_user_remove_lines | default([]) }}"
      when:
        - ios_snmp_cleanup | default(false) | bool
        - snmp_users_to_remove is defined
        - snmp_users_to_remove | length > 0

    # ------------------------------------------------------------
    # Apply removals
    # ------------------------------------------------------------
    - name: Cleanup | Remove SNMP host lines referencing removed users
      cisco.ios.ios_config:
        lines: "{{ snmp_host_remove_lines }}"
        match: none
      when:
        - ios_snmp_cleanup | default(false) | bool
        - snmp_host_remove_lines is defined
        - snmp_host_remove_lines | length > 0

    - name: Cleanup | Remove SNMP user lines for removed users
      cisco.ios.ios_config:
        lines: "{{ snmp_user_remove_lines }}"
        match: none
      when:
        - ios_snmp_cleanup | default(false) | bool
        - snmp_user_remove_lines is defined
        - snmp_user_remove_lines | length > 0

    # ------------------------------------------------------------
    # Verify (fail if still present)
    # ------------------------------------------------------------
    - name: Cleanup | Verify removed users are absent from running-config
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^snmp-server user "
          - "show running-config | include ^snmp-server host "
      register: snmp_verify
      when: ios_snmp_cleanup | default(false) | bool

    - name: Cleanup | Fail if any removed user still exists in config
      fail:
        msg: >-
          SNMP cleanup failed. Some users still appear in running-config:
          Users to remove: {{ snmp_users_to_remove }}
          Matching snmp-server user lines:
          {{
            (snmp_verify.stdout_lines[0] | default([]))
            | select('search', '\\b(' ~ (snmp_users_to_remove | join('|')) ~ ')\\b')
            | list
          }}
          Matching snmp-server host lines:
          {{
            (snmp_verify.stdout_lines[1] | default([]))
            | select('search', '\\b(' ~ (snmp_users_to_remove | join('|')) ~ ')\\b')
            | list
          }}
      when:
        - ios_snmp_cleanup | default(false) | bool
        - snmp_users_to_remove is defined
        - snmp_users_to_remove | length > 0
        - >
          (
            (
              (snmp_verify.stdout_lines[0] | default([]))
              | select('search', '\\b(' ~ (snmp_users_to_remove | join('|')) ~ ')\\b')
              | list
              | length
            ) > 0
          )
          or
          (
            (
              (snmp_verify.stdout_lines[1] | default([]))
              | select('search', '\\b(' ~ (snmp_users_to_remove | join('|')) ~ ')\\b')
              | list
              | length
            ) > 0
          )

    - name: Cleanup | Success message
      debug:
        msg: "SNMP cleanup complete. Removed users: {{ snmp_users_to_remove | default([]) }}"
      when: ios_snmp_cleanup | default(false) | bool




    

    

    