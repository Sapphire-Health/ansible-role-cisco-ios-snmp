---  
netbox_url: "https://netbox.example.com"
netbox_token: "your_token_here"
netbox_validate_certs: false


# snmp_rw_view: "RWview"
# snmp_rw_group: "RWgroup"
# snmp_ro_group: "ROgroup"
# snmp_ro_view: "ROview"
# snmp_rw_user: "RWuser"
# snmp_ro_user: "ROuser"
# snmp_auth_passphrase_rw: "Password"
# snmp_priv_passphrase_rw: "Password"
# snmp_auth_passphrase_ro: "Password"
# snmp_priv_passphrase_ro: "Password"
# snmp_acl_name: "MANAGEMENT"
# acl_apply_state: "replaced"


# CAT_SNMP_VIEW_NAME: ""
# CAT_SNMP_VIEW_OID: ""

# CAT_SNMP_GROUP: ""
# CAT_SNMP_ACCESS_LIST: ""

# CAT_SNMP_USER: ""
# CAT_SNMP_AUTH_PROTO: ""
# CAT_SNMP_AUTH_KEY: ""

# CAT_SNMP_PRIV_PROTO: ""
# CAT_SNMP_PRIV_BITS: 128
# CAT_SNMP_PRIV_KEY: ""

# CAT_SNMP_HOST: 1.2.3.4


ios_snmp_cleanup: false
ios_snmp_oid_test: "1.3.6.1.2.1.1.1.0"

ios_snmp:
  # ------------------------------------------------------------
  # ACL (built via NetBox elsewhere, referenced here by name)
  # ------------------------------------------------------------
  acl:
    name: MANAGEMENT
    tag: snmp_acl_allow

  # ------------------------------------------------------------
  # Views
  # ------------------------------------------------------------
  views:
    ro: ROview
    rw: RWview

  # ------------------------------------------------------------
  # Groups
  # ------------------------------------------------------------
  groups:
    ro: network-operator
    rw: network-admin

  group_context:
    enabled: true
    prefix: "vlan-"

  # ------------------------------------------------------------
  # Standard SNMPv3 users (RO / RW)
  # ------------------------------------------------------------
  users:
    - username: ROuser
      access: ro
      auth_proto: sha
      auth_pass: "password"
      priv_proto: aes
      priv_bits: 128
      priv_pass: "password"

    - username: RWuser
      access: rw
      auth_proto: sha
      auth_pass: "password"
      priv_proto: aes
      priv_bits: 128
      priv_pass: "password"

    - username: user1
      access: rw
      auth_proto: sha
      auth_pass: "password"
      priv_proto: aes
      priv_bits: 128
      priv_pass: "password"       
      host: 1.2.3.4